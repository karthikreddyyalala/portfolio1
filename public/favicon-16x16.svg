<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glowGradientSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glowSmall">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="8" cy="8" r="7" fill="#0f172a" stroke="url(#glowGradientSmall)" stroke-width="0.5"/>
  
  <!-- YKR Text -->
  <text x="8" y="11" font-family="Arial, sans-serif" font-size="6" font-weight="bold" 
        text-anchor="middle" fill="url(#glowGradientSmall)" filter="url(#glowSmall)">
    YKR
  </text>
</svg>
